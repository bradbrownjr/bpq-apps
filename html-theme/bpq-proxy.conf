# bpq-proxy.conf — nginx reverse proxy for LinBPQ web interface
#
# WHY THIS EXISTS:
# LinBPQ's management pages are baked into the binary. There are no HTML files
# to edit — the server generates every page dynamically. This proxy intercepts
# all responses and injects a <link> and <script> tag so that bpq-modern.css
# and bpq-terminal.js are applied to every page LinBPQ serves, without touching
# LinBPQ's configuration or source.
#
# SETUP:
# 1. Copy to /etc/nginx/sites-available/bpq-proxy.conf
# 2. sudo ln -s /etc/nginx/sites-available/bpq-proxy.conf /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo nginx -s reload
# 4. Run certbot: sudo certbot --nginx -d YOUR_HOSTNAME
#
# PORT FORWARDS (on your router):
#   External 80  → this host port 80
#   External 443 → this host port 443
# LinBPQ stays on its original port (default 9123) — no changes to bpq32.cfg.
#
# VARIABLES (set in deploy-theme.sh, substituted before copying):
#   %%HOSTNAME%%          — your node's public hostname (e.g. ws1ec.mainepacketradio.org)
#   %%LINBPQ_PORT%%       — LinBPQ HTTP port from bpq32.cfg HTTPPORT= (default 9123)
#   %%BBS_FILES_PATH%%    — absolute path to LinBPQ Files directory

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name %%HOSTNAME%%;

    # Allow certbot ACME challenges through before redirect
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name %%HOSTNAME%%;

    # TLS certificates — filled in by certbot, do not edit manually
    # ssl_certificate and ssl_certificate_key are added by certbot

    # Serve theme assets (CSS, JS, logo, files browser page)
    location /bpq-theme/ {
        alias /var/www/bpq-theme/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # BBS Files directory — JSON autoindex endpoint (consumed by files-browser.html)
    # Not directly linked; files-browser.html fetches this via JS
    location /files-data/ {
        alias %%BBS_FILES_PATH%%/;
        autoindex on;
        autoindex_format json;
        autoindex_localtime on;

        # CORS header so files-browser.html (same origin) can fetch JSON
        add_header Access-Control-Allow-Origin "https://%%HOSTNAME%%";

        # Prevent directory listing of parent paths (belt-and-suspenders)
        if ($uri ~* "\.\.") {
            return 403;
        }
    }

    # BBS Files browser — redirect to the themed single-page browser
    location = /files/ {
        return 302 /bpq-theme/files-browser.html;
    }

    # All other requests — proxy to LinBPQ, injecting theme assets
    location / {
        proxy_pass http://127.0.0.1:%%LINBPQ_PORT%%;

        # Preserve original host so LinBPQ session cookies and redirects
        # reference the correct hostname
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rewrite any absolute redirects LinBPQ emits that include :PORT
        # (e.g. after SYSOP login) so the browser stays on HTTPS without the port
        proxy_redirect http://%%HOSTNAME%%:%%LINBPQ_PORT%%/ https://%%HOSTNAME%%/;
        proxy_redirect http://127.0.0.1:%%LINBPQ_PORT%%/ https://%%HOSTNAME%%/;

        # Disable compression on upstream responses so sub_filter can see plaintext
        proxy_set_header Accept-Encoding "";

        # Increase buffer sizes for LinBPQ's larger management pages
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;

        # Inject theme CSS and JS into every HTML page just before </head>
        sub_filter '</head>'
            '<link rel="stylesheet" href="/bpq-theme/bpq-modern.css">'
            '<script src="/bpq-theme/bpq-terminal.js" defer></script>'
            '</head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
